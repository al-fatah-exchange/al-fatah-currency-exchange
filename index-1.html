<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Al Fata'h Currency Exchange</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;600;700&family=Anek+Devanagari:wght@500;600;700&family=Hind:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: left-aligned, one column of content on a pale green ground. The hero's exchange ticket
   (₹ on one side, ৳ on the other, rate left open) is the one memorable element; the rest stays quiet. */
:root{
  --bg:#F3F8F5;
  --surface:#FFFFFF;
  --surface-2:#E7F2EB;
  --ink:#0B2A1F;
  --muted:#48635A;
  --line:#D0E1D7;
  --brand:#0B3D2E;
  --on-brand:#FFFFFF;
  --link:#106A50;
  --tint:#DDEFE4;
  --danger:#B3261E;
  --hero:#06251A;--hero2:#0F6B3A;--lime:#B8F56E;
  --shadow:0 1px 2px rgba(11,61,46,.06),0 14px 32px -14px rgba(11,61,46,.22);
  --f-display:"Anek Bangla","Anek Devanagari","Hind Siliguri","Hind","Noto Sans Bengali","Noto Sans Devanagari",system-ui,sans-serif;
  --f-body:"Hind Siliguri","Hind","Noto Sans Bengali","Noto Sans Devanagari",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#07120D;--surface:#0E1F18;--surface-2:#132A21;--ink:#E5F2EA;--muted:#9FBBAD;--line:#1F392D;
  --brand:#4CC794;--on-brand:#04130C;--link:#6FDDAF;--tint:#14352A;--danger:#FF8A80;--hero:#04150E;--hero2:#0A4528;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 32px -14px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07120D;--surface:#0E1F18;--surface-2:#132A21;--ink:#E5F2EA;--muted:#9FBBAD;--line:#1F392D;
  --brand:#4CC794;--on-brand:#04130C;--link:#6FDDAF;--tint:#14352A;--danger:#FF8A80;--hero:#04150E;--hero2:#0A4528;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 32px -14px rgba(0,0,0,.6);color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,a,.icon-btn{touch-action:manipulation}
.icon-btn:active{background:var(--surface-2)}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.75 var(--f-body);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-display);line-height:1.35;margin:0;font-weight:700;text-wrap:balance}
p{margin:0}
a{color:var(--link)}
svg{display:block}
:focus-visible{outline:3px solid var(--link);outline-offset:3px;border-radius:6px}
.wrap{max-width:1120px;margin-inline:auto;padding-inline:max(20px,env(safe-area-inset-left,0px))}
section{padding-block:clamp(52px,8vw,92px);scroll-margin-top:76px}
.sec-head{display:grid;gap:10px;margin-bottom:32px;max-width:62ch}
.sec-head h2{font-size:clamp(1.6rem,3.6vw,2.2rem)}
.muted{color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:6px 22px;border-radius:12px;border:1.5px solid var(--brand);font:600 1rem/1.3 var(--f-body);text-decoration:none;cursor:pointer;transition:transform .15s ease,background .15s ease;text-align:center}
.btn svg{width:20px;height:20px;flex:none}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-primary:hover{transform:translateY(-2px)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line);border-width:1.5px}
.btn-ghost:hover{background:var(--surface-2)}
.btn-ghost svg{color:var(--link)}

/* header */
.site{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;min-height:68px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);margin-right:auto}
.mark{width:44px;height:44px;display:block;flex:none}
.brand-t{display:grid;line-height:1.25}
.brand-t b{font:700 1.05rem var(--f-display)}
.brand-t small{font-size:.8rem;color:var(--muted)}
.nav{display:flex;align-items:center;gap:6px}
.nav a.l{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500;font-size:.98rem}
.nav a.l:hover{background:var(--surface-2)}
.nav .cta{display:flex;gap:8px;margin-left:10px}
.nav .btn{min-height:44px;padding:4px 18px}
.tools{display:flex;gap:8px}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;font:600 .85rem var(--f-body)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.lang{width:auto;padding-inline:14px}
.lg{position:relative}
.lg-btn{display:flex;align-items:center;justify-content:center;gap:10px;min-width:0;padding:0 14px 0 12px;line-height:1;border-color:var(--line);border-color:color-mix(in srgb,var(--link) 42%,var(--line));transition:border-color .2s ease,box-shadow .2s ease}
.lg-globe{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lg-btn:hover{border-color:var(--link)}
.lg-btn[aria-expanded="true"]{border-color:var(--link);box-shadow:0 0 0 3px var(--tint),0 0 22px -4px var(--link)}
.lg-chev{width:16px;height:16px;fill:none;stroke:var(--link);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s ease}
.lg-btn[aria-expanded="true"] .lg-chev{transform:rotate(180deg)}
.lg-list{position:absolute;right:0;top:calc(100% + 10px);z-index:40;min-width:176px;padding:6px;border-radius:18px;border:1.5px solid var(--line);border-color:color-mix(in srgb,var(--link) 28%,var(--line));background:var(--surface);box-shadow:0 22px 44px -14px rgba(0,0,0,.5);display:grid;gap:4px}
.lg-list[hidden]{display:none}
.lg-o{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:4px 10px 4px 6px;border:1.5px solid transparent;border-radius:13px;background:transparent;color:var(--ink);cursor:pointer;text-align:left;transition:background .15s ease,border-color .15s ease}
.lg-o:hover,.lg-o:focus-visible{background:var(--surface-2)}
.lg-o[aria-selected="true"]{background:var(--tint);border-color:var(--link)}
.lg-f{flex:none;width:30px;height:30px;border-radius:9px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.lg-f svg{width:100%;height:100%}
.lg-t{display:grid;gap:2px;min-width:0}
.lg-n{font-size:.88rem;font-weight:600;line-height:1.3;letter-spacing:.005em}
.lg-c{font:600 .64rem/1 "Plus Jakarta Sans","Hind Siliguri",system-ui,sans-serif;color:var(--muted);letter-spacing:.1em}
.lg-ck{display:none;margin-left:auto;flex:none;width:15px;height:15px;fill:none;stroke:var(--link);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.lg-o[aria-selected="true"] .lg-ck{display:block}
@media(max-width:520px){
  .bar{gap:10px}
  .tools{gap:6px}
  .lg-btn{padding:0 10px;gap:6px}
  .lg-globe{width:20px;height:20px}
  .brand{gap:9px;min-width:0}
  .mark{width:38px;height:38px}
  .brand-t b{font-size:.98rem}
  .brand-t small{font-size:.72rem}
  .brand-t{white-space:nowrap}
  .lg{position:static}
  .tools{position:relative}
  .lg-list{min-width:min(176px,calc(100vw - 40px))}
}
@media(max-width:440px){
  #lgCur{display:none}
  .lg-btn{padding:0 10px;gap:4px}
}
@media(max-width:380px){
  .icon-btn{width:40px;height:40px}
  .icon-btn.lang{width:auto}
  .mark{width:34px;height:34px}
}
.lgf[lang="en"]{font-family:"Plus Jakarta Sans","Hind Siliguri",system-ui,sans-serif;letter-spacing:.01em}
.lgf[lang="bn"]{font-family:"Anek Bangla","Hind Siliguri","Noto Sans Bengali",sans-serif}
.lgf[lang="hi"]{font-family:"Anek Devanagari","Hind","Noto Sans Devanagari",sans-serif}
#menu{display:none}
.i-sun{display:none}
:root[data-theme="dark"] .i-sun{display:block}
:root[data-theme="dark"] .i-moon{display:none}
@media(max-width:960px){
  #menu{display:grid}
  .nav{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;align-items:stretch;gap:2px;background:var(--bg);border-bottom:1px solid var(--line);padding:12px max(20px,env(safe-area-inset-left,0px)) 20px}
  .nav.open{display:flex}
  .nav .cta{flex-direction:column;margin:10px 0 0}
  .nav a.l{padding:12px 8px}
  .brand{margin-right:auto}
}

/* hero */
.hero-band{position:relative;overflow:hidden;color:#EEFBEA;background:radial-gradient(90% 120% at 88% -10%,var(--hero2) 0%,transparent 62%),var(--hero)}
.hero-band::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-radial-gradient(circle at 92% 8%,transparent 0 18px,rgba(184,245,110,.07) 18px 19px),repeating-radial-gradient(circle at 0% 100%,transparent 0 26px,rgba(255,255,255,.045) 26px 27px)}
.hero{position:relative;padding-block:clamp(40px,7vw,88px) clamp(64px,8vw,112px);display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(36px,5vw,72px);align-items:center}
.hero .biz{font-weight:600;color:var(--lime);margin-bottom:10px}
.hero h1{font-size:clamp(2.5rem,7.2vw,4.8rem);font-weight:800;line-height:1.12;letter-spacing:-.02em;color:var(--lime)}
.hero .sub{margin-top:20px;font-size:1.12rem;max-width:54ch;color:rgba(238,251,234,.9)}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.hero-band .btn-primary{background:var(--lime);border-color:var(--lime);color:#06251A}
.hero-band .btn-ghost{color:#EEFBEA;border-color:rgba(238,251,234,.38)}
.hero-band .btn-ghost:hover{background:rgba(255,255,255,.1)}
.hero-band .btn-ghost svg{color:var(--lime)}
.hero-band .conv .btn-primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.notice{margin-top:24px;padding:14px 16px;border-left:4px solid var(--lime);background:rgba(255,255,255,.08);border-radius:0 12px 12px 0;font-size:.98rem;max-width:54ch;color:#EEFBEA}

/* info strip */
.strip{background:#030D08;color:#EAF7F0}
.strip-in{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px 28px;padding-block:20px}
.strip-in div{display:flex;gap:12px;align-items:center;font-weight:500;font-size:.98rem}
.strip svg{width:24px;height:24px;color:var(--lime);flex:none}

/* converter card + 3D */
.stage{position:relative;perspective:1100px;padding:30px 0 40px}
.conv{position:relative;background:var(--surface);color:var(--ink);border-radius:30px;padding:clamp(20px,3.4vw,30px);box-shadow:0 34px 60px -22px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.07);transform-style:preserve-3d;transition:transform .25s ease-out;will-change:transform;animation:rise .8s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(20px) rotateX(8deg)}to{opacity:1;transform:none}}
.cv-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px;font:700 1.2rem/1.3 var(--f-display)}
.pill{padding:2px 12px;border-radius:99px;background:var(--tint);color:var(--link);font:600 .82rem/1.6 var(--f-body);white-space:nowrap}
.cv-l{display:block;font-weight:600;font-size:.95rem;margin-bottom:6px}
.cv-box{display:flex;align-items:center;gap:10px;min-height:64px;padding:6px 14px;border:1.5px solid var(--line);border-radius:16px;background:var(--bg)}
.cv-box:focus-within{border-color:var(--link);box-shadow:0 0 0 3px var(--tint)}
.cv-box input{flex:1;min-width:0;height:50px;border:0;background:transparent;color:var(--ink);font:700 1.55rem var(--f-display);outline:0;padding:0}
.qout{flex:1;min-width:0;font:700 1.55rem/1.2 var(--f-display);color:var(--ink);overflow-wrap:anywhere;padding:8px 0}
.qout.empty{color:var(--muted);font-weight:500}
.est{margin-top:6px;font-weight:700;font-size:1.08rem;color:var(--link);min-height:0}
.est:empty{display:none}
.cv-box .lt{flex:1;min-width:0;color:var(--muted);font-weight:600;line-height:1.45;font-size:.98rem;display:flex;align-items:center;gap:8px}
.cv-box .lt svg{width:18px;height:18px;flex:none}
.cur-tag{display:flex;align-items:center;gap:8px;font:700 1.05rem var(--f-display);flex:none}
.chip{width:34px;height:34px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 1.5px var(--line)}
.chip svg{width:100%;height:100%}
.cv-swap{width:44px;height:44px;margin:10px auto;border-radius:50%;background:var(--lime);color:#06251A;display:grid;place-items:center;border:0;padding:0;cursor:pointer;transition:transform .3s ease}
.cv-swap:hover{transform:rotate(180deg)}
.lab{font-weight:600}
.field select{width:100%;min-height:52px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:400 1.05rem/1.5 var(--f-body)}
.field select:focus{border-color:var(--link);outline:0;box-shadow:0 0 0 3px var(--tint)}
.field select[aria-invalid="true"]{border-color:var(--danger)}
#btnExchange{flex:1 1 220px;min-height:54px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:14px;background:var(--surface-2)}
.seg button{min-height:52px;border:0;border-radius:10px;background:transparent;color:var(--ink);font:600 .95rem/1.35 var(--f-body);cursor:pointer;padding:6px 8px}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.cv-swap svg{width:20px;height:20px}
.cv-rows{list-style:none;margin:18px 0;padding:0;display:grid;gap:8px;font-size:.95rem}
.cv-rows li{display:flex;justify-content:space-between;gap:14px}
.cv-rows span{color:var(--muted)}
.cv-rows b{text-align:right;font-weight:600}
.btn-block{width:100%}
.cv-note{margin-top:12px;text-align:center;font-size:.92rem;color:var(--muted)}
.cv-err{margin-top:6px}

.cw{position:absolute;z-index:3;animation:bob 5.5s ease-in-out infinite;pointer-events:none}
.cw1{top:-70px;right:22px}
.cw2{bottom:-36px;right:-20px;animation-delay:-2.4s}
@keyframes bob{50%{transform:translateY(-14px)}}
.ctilt{transform-style:preserve-3d;transform:rotateX(-16deg) rotateZ(8deg)}
.coin{position:relative;width:var(--d);height:var(--d);transform-style:preserve-3d;animation:spin 9s linear infinite}
.coin-bdt{animation-duration:7s;animation-direction:reverse}
@keyframes spin{to{transform:rotateY(360deg)}}
.coin>i{position:absolute;inset:0;border-radius:50%;display:block}
.coin .edge{background:var(--edge)}
.coin .face{display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;font:800 calc(var(--d)*.46)/1 var(--f-display);font-style:normal;color:var(--glyph);background:var(--face);box-shadow:inset 0 0 0 calc(var(--d)*.06) var(--rim),inset 0 0 0 calc(var(--d)*.085) rgba(0,0,0,.14)}
.coin .front{transform:translateZ(8px)}
.coin .back{transform:rotateY(180deg) translateZ(8px)}
.coin-inr{--d:96px;--face:radial-gradient(circle at 32% 28%,#EFFFD0,#A2E54F 52%,#4E9A22);--edge:#3F8A1B;--rim:#D4F7A0;--glyph:#173D0C}
.coin-bdt{--d:78px;--face:radial-gradient(circle at 32% 28%,#FFFFFF,#DFF0E5 55%,#A6CBB2);--edge:#86AE95;--rim:#FFFFFF;--glyph:#0B3D2E}
@media(max-width:560px){.coin-inr{--d:70px}.coin-bdt{--d:56px}.cw1{top:-54px;right:14px}.cw2{right:-4px;bottom:-30px}}

/* order */
#order{border-top:1px solid var(--line)}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:26px;padding:clamp(20px,4vw,36px);box-shadow:var(--shadow);max-width:720px}
.form{display:grid;gap:20px}
.field{display:grid;gap:6px}
.field label{font-weight:600}
.field label i{font-style:normal;font-weight:400;color:var(--muted);font-size:.88rem}
.field input,.field textarea{width:100%;min-height:52px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:400 1.05rem/1.5 var(--f-body)}
.field textarea{min-height:104px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--link);outline:0;box-shadow:0 0 0 3px var(--tint)}
.field input[aria-invalid="true"]{border-color:var(--danger)}
.hint{font-size:.9rem;color:var(--muted)}
.err{font-size:.92rem;color:var(--danger);font-weight:500;min-height:0}
.err:empty{display:none}
.rows{display:grid;margin:6px 0 22px;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.row dt{color:var(--muted);font-size:.95rem}
.row dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.row .amt{font:700 1.5rem/1.3 var(--f-display)}
.pend{display:inline-block;padding:2px 12px;border-radius:99px;background:var(--tint);color:var(--link);font-weight:600;font-size:.95rem}
.warn{padding:14px 16px;border-radius:12px;background:var(--surface-2);font-size:.96rem;margin-bottom:22px}
.actions{display:flex;gap:12px;flex-wrap:wrap}
@media(max-width:520px){.row{grid-template-columns:1fr;gap:2px}}

/* payment method dropdown */
.field{position:relative}
.pm-sel{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;min-height:0!important;padding:0!important;border:0!important}
.pm{position:relative}
.dd-btn{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:8px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:600 1.02rem/1.3 var(--f-body);text-align:left;cursor:pointer;transition:border-color .15s ease,box-shadow .15s ease}
.dd-btn:hover{border-color:var(--link)}
.dd-btn[aria-expanded="true"]{border-color:var(--link);box-shadow:0 0 0 3px var(--tint)}
.dd-ph{flex:1;color:var(--muted);font-weight:400}
.dd-btn .pm-n{flex:1}
.dd-chev{width:20px;height:20px;margin-left:auto;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;color:var(--muted);transition:transform .2s ease}
.dd-btn[aria-expanded="true"] .dd-chev{transform:rotate(180deg)}
.dd-list{position:absolute;z-index:15;left:0;right:0;top:calc(100% + 6px);max-height:min(380px,60vh);overflow-y:auto;padding:8px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);box-shadow:0 22px 44px -14px rgba(0,0,0,.4)}
.dd-list[hidden]{display:none}
.pm-h{font:600 .76rem/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 10px 4px}
.dd-o{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:6px 10px;border:0;border-radius:12px;background:transparent;color:var(--ink);font:500 .98rem/1.3 var(--f-body);text-align:left;cursor:pointer}
.dd-o:hover,.dd-o:focus-visible{background:var(--surface-2)}
.dd-o[aria-selected="true"]{background:var(--tint);font-weight:600}
.dd-o[aria-selected="true"]::after{content:"\2713";margin-left:auto;color:var(--link);font-weight:700}
.pm-c{position:relative;overflow:hidden;flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:700 .8rem/1 var(--f-display);letter-spacing:-.02em}
.pm-l{background:transparent!important;color:transparent!important;overflow:visible}
.pm-c img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.pm-n{min-width:0;overflow-wrap:anywhere}
.pm-sel[aria-invalid="true"]+.pm .dd-btn{border-color:var(--danger);box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 18%,transparent)}

/* how */
#how{border-top:1px solid var(--line)}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px;counter-reset:s}
.steps li{counter-increment:s;background:var(--surface);border:1.5px solid var(--line);border-radius:26px;padding:26px;display:grid;gap:12px;align-content:start;transition:transform .25s ease,box-shadow .25s ease}
.steps{perspective:900px}
.steps li:hover{transform:translateY(-6px) rotateX(5deg);box-shadow:var(--shadow)}
.steps li::before{content:counter(s);width:36px;height:36px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font:700 1rem var(--f-display)}
.how-note{margin-top:20px;color:var(--muted);max-width:62ch}

/* faq */
#faq{border-top:1px solid var(--line)}
.faq{max-width:780px;border-top:1.5px solid var(--ink)}
.faq details{border-bottom:1px solid var(--line);padding:16px 0}
.faq summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px;font:600 1.12rem/1.5 var(--f-display)}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--muted);font-size:1.4rem;line-height:1}
.faq details[open] summary::after{content:"\2212"}
.faq p{margin-top:10px;color:var(--muted);max-width:66ch}

/* contact */
#contact{border-top:1px solid var(--line)}
.contact{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,.8fr);gap:clamp(24px,4vw,56px);align-items:start}
.facts{margin:0;display:grid}
.facts div{padding:14px 0;border-bottom:1px solid var(--line);display:grid;gap:2px}
.facts dt{color:var(--muted);font-size:.92rem}
.facts dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.contact .actions{flex-direction:column;align-items:stretch}
@media(max-width:820px){.contact,.hero{grid-template-columns:minmax(0,1fr)}}

.logo-card{background:#fff;border-radius:26px;padding:12px;box-shadow:var(--shadow);width:min(100%,280px)}
.logo-card img{display:block;width:100%;height:auto;border-radius:16px}

/* legal + footer */
.legal{border-top:1px solid var(--line);padding-block:48px}
.legal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:28px}
.legal h3{font-size:1.1rem;margin-bottom:8px;scroll-margin-top:76px}
.legal p{font-size:.95rem;color:var(--muted)}
footer{border-top:1px solid var(--line);background:var(--surface-2);padding-block:36px 44px}
.foot{display:grid;gap:20px}
.foot nav{display:flex;flex-wrap:wrap;gap:6px 22px}
.foot nav a{color:var(--ink);text-decoration:none;font-weight:500;padding:4px 0}
.foot nav a:hover{text-decoration:underline}
.foot p{font-size:.92rem;color:var(--muted);max-width:70ch}
.fine{font-size:.85rem}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

/* ---------- helpers (also used by tests) ---------- */
function toAscii(s) {
  return String(s).replace(/[০-৯]/g, function (c) { return String(c.charCodeAt(0) - 0x09E6); });
}
function parseAmount(raw, dir) {
  var s = toAscii(raw).replace(/[\s,₹]/g, "");
  if (s === "") return { err: "e_amt_empty" };
  if (/^-/.test(s)) return { err: "e_amt_neg" };
  if (!/^\d+(\.\d{1,2})?$/.test(s)) return { err: "e_amt_num" };
  var n = parseFloat(s);
  if (!isFinite(n) || n > 1e9) return { err: "e_amt_num" };
  if (n < minFor(dir)) return { err: dir === "bdt" ? "e_amt_min_bdt" : "e_amt_min" };
  return { value: n };
}
function parsePhone(raw) {
  var s = toAscii(raw).replace(/[\s\-().]/g, "");
  if (!/^\+?\d{7,15}$/.test(s)) return { err: "e_phone" };
  return { value: s };
}
function formatInr(n) {
  var f = Number.isInteger(n) ? 0 : 2;
  return n.toLocaleString("en-IN", { minimumFractionDigits: f, maximumFractionDigits: 2 });
}
function makeRef() {
  var d = new Date(), pad = function (x) { return String(x).padStart(2, "0"); };
  var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", out = "", buf = new Uint32Array(4);
  if (window.crypto && window.crypto.getRandomValues) { window.crypto.getRandomValues(buf); }
  else { for (var i = 0; i < 4; i++) buf[i] = Math.floor(Math.random() * 4294967296); }
  for (var j = 0; j < 4; j++) out += chars[buf[j] % chars.length];
  return CONFIG.refPrefix + "-" + String(d.getFullYear()).slice(2) + pad(d.getMonth() + 1) + pad(d.getDate()) + "-" + out;
}
function buildMessage(d) {
  var dr = d.dir || "inr", o = otherDir(dr), bn = state.lang === "bn", hi = state.lang === "hi", sep = "-----------------------", L;
  var est = fmt2(o, convert(d.amount, dr));
  var rate = dr === "inr" ? "1 INR = " + rateText() + " BDT" : "1 BDT = " + rateFor("bdt").toFixed(4) + " INR";
  var dirTxt = dr === "inr" ? (hi ? "भारत → बांग्लादेश (INR → BDT)" : bn ? "ভারত → বাংলাদেশ (INR → BDT)" : "India \u2192 Bangladesh (INR \u2192 BDT)") : (hi ? "बांग्लादेश → भारत (BDT → INR)" : bn ? "বাংলাদেশ → ভারত (BDT → INR)" : "Bangladesh \u2192 India (BDT \u2192 INR)");
  if (hi) {
    L = [CONFIG.businessName + " \u2014 नया एक्सचेंज अनुरोध", sep,
      "संदर्भ: " + d.ref, "नाम: " + d.name, "WhatsApp: " + d.phone, "एक्सचेंज: " + dirTxt,
      "भेजने की राशि: " + CUR[dr].sym + formatInr(d.amount),
      "अनुमानित प्राप्ति: " + est + " (रेट " + rate + ", पुष्टि आवश्यक)",
      "पैसे भेजने का माध्यम: " + methodLabel(d.pay),
      "पैसे प्राप्त करने का माध्यम: " + methodLabel(d.recv)];
    if (d.acct) L.push("नंबर/खाता: " + d.acct);
    if (d.notes) L.push("अतिरिक्त संदेश: " + d.notes);
    L.push(sep, "नमस्ते, मुझे ऊपर दी गई जानकारी के अनुसार एक्सचेंज करना है। कृपया मौजूदा रेट, शुल्क, उपलब्धता और पेमेंट विवरण बताएँ।");
  } else if (bn) {
    L = [CONFIG.businessName + " \u2014 নতুন এক্সচেঞ্জ রিকোয়েস্ট", sep,
      "রেফারেন্স: " + d.ref, "নাম: " + d.name, "WhatsApp: " + d.phone, "এক্সচেঞ্জ: " + dirTxt,
      "পাঠাতে চাই: " + CUR[dr].sym + formatInr(d.amount),
      "আনুমানিক পাবো: " + est + " (রেট " + rate + ", নিশ্চিত করতে হবে)",
      "টাকা পাঠাবো: " + methodLabel(d.pay),
      "টাকা নেবো: " + methodLabel(d.recv)];
    if (d.acct) L.push("নম্বর/অ্যাকাউন্ট: " + d.acct);
    if (d.notes) L.push("অতিরিক্ত বার্তা: " + d.notes);
    L.push(sep, "হ্যালো, আমি উপরের তথ্য অনুযায়ী এক্সচেঞ্জ করতে চাই। বর্তমান রেট, চার্জ, প্রাপ্যতা ও পেমেন্ট ডিটেইলস জানাবেন।");
  } else {
    L = [CONFIG.businessName + " \u2014 New Exchange Inquiry", sep,
      "Inquiry Reference: " + d.ref, "Customer Name: " + d.name, "Customer WhatsApp: " + d.phone, "Exchange Direction: " + dirTxt,
      "Requested " + CUR[dr].code + " Amount: " + CUR[dr].sym + formatInr(d.amount),
      "Exchange Rate Shown: " + rate + " (to be confirmed)",
      "Estimated " + CUR[o].code + " Amount: " + est + " (subject to confirmation)",
      "Send With: " + methodLabel(d.pay), "Receive In: " + methodLabel(d.recv)];
    if (d.acct) L.push("Receiver Number/Account: " + d.acct);
    L.push("Additional Notes: " + (d.notes || "None"), sep,
      "Hello, I would like to exchange " + CUR[dr].code + " to " + CUR[o].code + " with the details above. Please confirm the current rate, fees, availability and payment details.");
  }
  return L.join("\n");
}
function waLink(text) {
  var base = "https://wa.me/" + CONFIG.whatsappNumber;
  if (!text) return base;
  return base + "?text=" + encodeURIComponent(text).replace(/'/g, "%27");
}

/* ---------- language ---------- */
function applyLang() {
  document.documentElement.lang = state.lang;
  document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = t(el.getAttribute("data-i18n")); });
  document.querySelectorAll("[data-i18n-ph]").forEach(function (el) { el.setAttribute("placeholder", t(el.getAttribute("data-i18n-ph"))); });
  document.querySelectorAll("[data-i18n-aria]").forEach(function (el) { el.setAttribute("aria-label", t(el.getAttribute("data-i18n-aria"))); });
  var LN = { en: "English", bn: "\u09AC\u09BE\u0982\u09B2\u09BE", hi: "\u0939\u093F\u0928\u094D\u0926\u0940" };
  $("lgCur").textContent = LN[state.lang]; $("lgCur").setAttribute("lang", state.lang);
  document.querySelectorAll(".lg-o").forEach(function (o) { o.setAttribute("aria-selected", o.getAttribute("data-v") === state.lang ? "true" : "false"); });
  $("lang").setAttribute("aria-label", "Language / ভাষা / भाषा");
  document.querySelectorAll(".err[data-key]").forEach(function (el) { el.textContent = t(el.getAttribute("data-key")); });
  renderDir(); updateQuick(); updateEst();
  if (state.data) renderSummary();
}
function setLang(l) {
  state.lang = l;
  try { localStorage.setItem("af_lang", l); } catch (e) {}
  applyLang();
}

/* ---------- theme ---------- */
function setTheme(m) { document.documentElement.setAttribute("data-theme", m); try { localStorage.setItem("af_theme", m); } catch (e) {} }

/* ---------- form ---------- */
function showErr(inputId, errId, key) {
  var inp = $(inputId), el = $(errId);
  if (key) { el.setAttribute("data-key", key); el.textContent = t(key); inp.setAttribute("aria-invalid", "true"); }
  else { el.removeAttribute("data-key"); el.textContent = ""; inp.removeAttribute("aria-invalid"); }
}
function validate() {
  var am = parseAmount($("fAmount").value, state.dir);
  var pay = $("fPay").value, recv = $("fRecv").value;
  var name = $("fName").value.trim().replace(/\s+/g, " ");
  var ph = parsePhone($("fPhone").value);
  var firstBad = null;
  function mark(id, errId, key) { showErr(id, errId, key); if (key) firstBad = firstBad || id; }
  mark("fAmount", "eAmount", am.err || null);
  mark("fPay", "ePay", pay ? null : "e_pay");
  mark("fRecv", "eRecv", recv ? null : "e_recv");
  mark("fName", "eName", name.length < 2 ? "e_name" : null);
  mark("fPhone", "ePhone", ph.err || null);
  if (firstBad) {
    var fb = $(firstBad), tile = (firstBad === "fPay" || firstBad === "fRecv") ? $("p" + firstBad.slice(1)).querySelector(".dd-btn") : null;
    (tile || fb).focus(); return null;
  }
  return { name: name, phone: ph.value, amount: am.value, dir: state.dir, pay: pay, recv: recv, acct: $("fAcct").value.trim(), notes: $("fMsg").value.trim() };
}
function renderSummary() {
  var d = state.data;
  $("sRef").textContent = d.ref;
  $("sName").textContent = d.name;
  $("sPhone").textContent = d.phone;
  var dr = d.dir || "inr", o = otherDir(dr);
  $("sAmtL").textContent = t(dr === "inr" ? "sum_amt" : "sum_amt_bdt");
  $("sAmt").textContent = CUR[dr].sym + formatInr(d.amount);
  $("sRate").textContent = rateLine(dr) + " \u00B7 " + t("sum_pending");
  $("sEstL").textContent = t(dr === "inr" ? "sum_bdt" : "sum_est_inr");
  $("sBdt").textContent = fmt2(o, convert(d.amount, dr));
  $("sPay").textContent = methodLabel(d.pay);
  $("sRecv").textContent = methodLabel(d.recv);
  $("sAcct").textContent = d.acct || t("sum_none");
  $("sNotes").textContent = d.notes || t("sum_none");
  $("sWa").setAttribute("href", waLink(buildMessage(d)));
}
function showForm() { $("summaryPanel").hidden = true; $("formPanel").hidden = false; $("fAmount").focus(); }
function showSummary() { $("formPanel").hidden = true; $("summaryPanel").hidden = false; $("summaryPanel").scrollIntoView({ block: "start" }); }
function resetAll() {
  $("form").reset();
  syncAll();
  updateEst();
  ["fName", "fPhone", "fAmount", "fPay", "fRecv"].forEach(function (id) { showErr(id, "e" + id.slice(1), null); });
  state.ref = null; state.data = null;
  showForm();
}

document.addEventListener("DOMContentLoaded", init);
function init() {
  /* fill business details from CONFIG */
  document.querySelectorAll("[data-biz]").forEach(function (el) { el.textContent = CONFIG.businessName; });
  document.querySelectorAll("[data-wa]").forEach(function (el) { el.setAttribute("href", waLink()); });
  document.querySelectorAll("[data-fb]").forEach(function (el) { el.setAttribute("href", CONFIG.facebookUrl); });
  document.querySelectorAll("[data-wa-display]").forEach(function (el) { el.textContent = CONFIG.whatsappDisplay; });
  document.querySelectorAll("[data-fb-display]").forEach(function (el) { el.textContent = CONFIG.facebookUrl; });

  /* saved preferences (storage may be blocked inside Google Sites, so everything is optional) */
  var savedLang = null, savedTheme = null;
  try { savedLang = localStorage.getItem("af_lang"); savedTheme = localStorage.getItem("af_theme"); } catch (e) {}
  if (savedLang === "en" || savedLang === "bn" || savedLang === "hi") state.lang = savedLang;
  var sysDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", savedTheme || (sysDark ? "dark" : "light"));
  applyLang();

  function closeLG() { $("lgBox").querySelector(".lg-list").hidden = true; $("lang").setAttribute("aria-expanded", "false"); }
  $("lang").addEventListener("click", function () {
    var l = $("lgBox").querySelector(".lg-list"), open = l.hidden;
    closeDD(); closeLG();
    if (open) { l.hidden = false; $("lang").setAttribute("aria-expanded", "true"); }
  });
  $("lgBox").addEventListener("click", function (e) {
    var o = e.target.closest(".lg-o"); if (!o) return;
    setLang(o.getAttribute("data-v")); closeLG(); $("lang").focus();
  });
  document.addEventListener("click", function (e) { if (!e.target.closest(".lg")) closeLG(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeLG(); });
  $("theme").addEventListener("click", function () {
    setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
  });
  var nav = $("nav"), menu = $("menu");
  menu.addEventListener("click", function () {
    var open = nav.classList.toggle("open"); menu.setAttribute("aria-expanded", open ? "true" : "false");
  });
  nav.addEventListener("click", function (e) {
    if (e.target.closest("a")) { nav.classList.remove("open"); menu.setAttribute("aria-expanded", "false"); }
  });

  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var d = validate();
    if (!d) return;
    if (!state.ref) state.ref = makeRef();
    d.ref = state.ref;
    state.data = d;
    renderSummary();
    showSummary();
    var a = document.createElement("a");
    a.href = $("sWa").getAttribute("href"); a.target = "_blank"; a.rel = "noopener noreferrer";
    document.body.appendChild(a); a.click(); a.remove();
  });
  ["fName", "fPhone", "fAmount", "fPay", "fRecv"].forEach(function (id) {
    $(id).addEventListener("input", function () { if ($(id).getAttribute("aria-invalid")) showErr(id, "e" + id.slice(1), null); });
  });
  $("btnEdit").addEventListener("click", showForm);
  $("btnReset1").addEventListener("click", resetAll);
  $("btnReset2").addEventListener("click", resetAll);

  /* 3D coins: stacked layers give each coin a visible thickness */
  document.querySelectorAll(".coin").forEach(function (c) {
    var g = c.getAttribute("data-glyph"), n = 7, i, el;
    for (i = 0; i < n; i++) { el = document.createElement("i"); el.className = "edge"; el.style.transform = "translateZ(" + ((i - (n - 1) / 2) * 2.4) + "px)"; c.appendChild(el); }
    ["front", "back"].forEach(function (s) { el = document.createElement("i"); el.className = "face " + s; el.textContent = g; c.appendChild(el); });
  });

  /* card tilts toward the pointer (desktop only, skipped for reduced motion) */
  var stage = $("stage"), conv = $("conv");
  if (window.matchMedia && matchMedia("(hover:hover) and (pointer:fine)").matches && !matchMedia("(prefers-reduced-motion:reduce)").matches) {
    stage.addEventListener("pointermove", function (e) {
      var r = stage.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
      conv.style.transform = "rotateY(" + (x * 10).toFixed(2) + "deg) rotateX(" + (-y * 10).toFixed(2) + "deg)";
    });
    stage.addEventListener("pointerleave", function () { conv.style.transform = ""; });
  }

  /* quick card: carries the amount into the full form */
  function goQuick() {
    var raw = $("qAmount").value.trim(), q = $("qAmount"), er = $("eQuick");
    if (raw !== "") {
      var am = parseAmount(raw, state.dir);
      if (am.err) { er.setAttribute("data-key", am.err); er.textContent = t(am.err); q.setAttribute("aria-invalid", "true"); q.focus(); return; }
      $("fAmount").value = String(am.value); updateEst();
    }
    er.removeAttribute("data-key"); er.textContent = ""; q.removeAttribute("aria-invalid");
    $("summaryPanel").hidden = true; $("formPanel").hidden = false;
    $("order").scrollIntoView({ behavior: "smooth", block: "start" });
    $(raw !== "" ? "fPay" : "fAmount").focus({ preventScroll: true });
  }
  document.querySelectorAll(".seg button").forEach(function (b) { b.addEventListener("click", function () { setDir(b.getAttribute("data-dir")); }); });
  $("qSwap").addEventListener("click", function () { setDir(otherDir(state.dir)); });
  [["pPay", "fPay"], ["pRecv", "fRecv"]].forEach(function (p) {
    $(p[0]).addEventListener("click", function (e) {
      var o = e.target.closest(".dd-o");
      if (o) {
        var sel = $(p[1]); sel.value = o.getAttribute("data-v");
        renderTiles(p[1], p[0], $(p[0])._list);
        sel.dispatchEvent(new Event("input", { bubbles: true }));
        $(p[0]).querySelector(".dd-btn").focus();
        return;
      }
      var b = e.target.closest(".dd-btn"); if (!b) return;
      var lst = $(p[0]).querySelector(".dd-list"), willOpen = lst.hidden;
      closeDD();
      if (willOpen) {
        lst.hidden = false; b.setAttribute("aria-expanded", "true");
        var s = lst.querySelector('[aria-selected="true"]'); if (s) s.scrollIntoView({ block: "nearest" });
      }
    });
  });
  document.addEventListener("click", function (e) { if (!e.target.closest(".pm")) closeDD(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeDD(); });
  $("qAmount").addEventListener("input", updateQuick);
  $("fAmount").addEventListener("input", updateEst);
  $("qGo").addEventListener("click", goQuick);
  $("qAmount").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); goQuick(); } });
  $("qAmount").addEventListener("input", function () { $("eQuick").removeAttribute("data-key"); $("eQuick").textContent = ""; $("qAmount").removeAttribute("aria-invalid"); });
}
</script>
</body>
</html>
